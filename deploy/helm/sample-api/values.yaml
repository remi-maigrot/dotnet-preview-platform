# Default values are production-shaped. Preview and local overrides live in ci/*.yaml and in the operator.

image:
  repository: ghcr.io/remi-maigrot/sample-api
  # Required. Images are tagged with the git commit SHA, never "latest".
  tag: ""
  # Optional. When set, the image is pulled by digest (tag is kept for readability).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 2

# ASPNETCORE_ENVIRONMENT: selects appsettings.{environment}.json.
environment: Production

# Non-secret settings, injected as environment variables. "__" separates configuration sections.
config: {}
#  Features__AutoApproveSickLeave: "true"

secrets:
  # Required. Secret mounted as files under /var/run/secrets/sample-api, one key per setting
  # (Database__ConnectionString, Authentication__Jwt__SigningKey). The chart never creates it.
  existingSecret: ""

migrations:
  enabled: true
  image:
    repository: ghcr.io/remi-maigrot/sample-migrator
    # Defaults to image.tag: the migrator and the API are always released together.
    tag: ""
    digest: ""
  # Required when migrations are enabled. Holds Database__ConnectionString for a role allowed to run DDL.
  existingSecret: ""
  backoffLimit: 1
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 192Mi

opentelemetry:
  # OTLP/gRPC endpoint of the collector. Empty disables export.
  endpoint: ""
  resourceAttributes: ""
  metricExportIntervalMs: 15000

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  # maxUnavailable rather than minAvailable: with a single replica, minAvailable: 1 would block node drains.
  maxUnavailable: 1

topologySpread:
  enabled: true
  maxSkew: 1

# Encrypted database backups and their daily restore test. See docs/data-protection.md.
backup:
  enabled: false
  image:
    repository: ghcr.io/remi-maigrot/sample-backup
    # Defaults to image.tag.
    tag: ""
    digest: ""
  schedule: "15 2 * * *"
  # Backups older than this are deleted. Erased personal data survives in backups for at most this long.
  keepDays: 14
  # Required when enabled. Secret with the libpq variables PGHOST, PGPORT, PGDATABASE, PGUSER and PGPASSWORD of
  # a role that can read every table.
  existingSecret: ""
  # Required when enabled. age public keys (age1...) that can decrypt the backups; public keys are not secrets.
  # Give at least two: the restore-test key and an offline recovery key kept by someone else.
  recipients: []
  persistence:
    size: 5Gi
    storageClassName: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  restoreTest:
    enabled: true
    schedule: "45 3 * * *"
    # The test fails when the latest backup is older than this: it also proves backups still run.
    maxAgeHours: 26
    # Required when the restore test is enabled. Secret holding an age private key under the key "identity".
    identitySecret: ""
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  database:
    # Where the database is, for the backup's NetworkPolicy. Defaults to networkPolicy.database.
    port: 5432

# Time the pod keeps serving after it is removed from the endpoints, so in-flight requests and load
# balancers catch up before shutdown starts. Must stay below terminationGracePeriodSeconds.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: true
  # Namespace of the ingress controller allowed to reach the API.
  ingressControllerNamespace: kube-system
  database:
    port: 5432
    podSelector:
      app.kubernetes.io/name: postgresql
    # Empty: the database runs in the release namespace.
    namespace: ""
  collector:
    namespace: observability
    port: 4317
  # Additional egress rules, e.g. towards the external holiday calendar when that feature is on.
  extraEgress: []

nodeSelector: {}
tolerations: []
affinity: {}

# Recorded as pod annotations and used for release annotations in Grafana.
release:
  sha: ""
  author: ""
