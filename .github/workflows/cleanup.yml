name: Image cleanup

# Every pull request pushes five images tagged with its commit SHA. This keeps the registry from growing without
# limit: SHA builds older than the retention are deleted, releases and everything they reference are kept.
# The selection logic is in .github/scripts/prune_images.py and is unit tested in CI.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only report what would be deleted
        type: boolean
        default: true
      days:
        description: Keep SHA builds younger than this many days
        type: number
        default: 14

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prune:
    name: Prune old image versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          # The scheduled run deletes; a manual run is a dry run unless asked otherwise.
          APPLY: ${{ github.event_name == 'schedule' || inputs.dry-run == false }}
          DAYS: ${{ inputs.days || 14 }}
        run: |
          # Scheduled events carry no repository payload: ask the API whether the owner is a user or an organisation.
          owner_type="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .owner.type)"
          args=(--owner "$OWNER" --owner-type "$owner_type" --days "$DAYS")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python3 .github/scripts/prune_images.py "${args[@]}" \
            sample-api sample-migrator preview-operator sample-deployer sample-seeder sample-backup >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
