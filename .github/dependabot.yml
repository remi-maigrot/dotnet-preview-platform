version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Let new releases age a week before adopting them (supply-chain hygiene).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*", "Npgsql.OpenTelemetry"]
      aspnetcore-efcore:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.EntityFrameworkCore*", "Microsoft.Extensions.*", "Npgsql*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "Shouldly", "NSubstitute", "Testcontainers*", "coverlet*", "Verify*", "WireMock*", "Respawn", "NetArchTest*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /src/Sample.Api
      - /src/Sample.Migrator
      - /src/Preview.Operator
      - /src/Preview.DataSeeder
      - /deploy/helm
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      dotnet-images:
        patterns: ["dotnet/*"]

  # Upstream charts of the observability stack (Chart.yaml dependencies and Chart.lock).
  - package-ecosystem: helm
    directory: /deploy/observability
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      observability-charts:
        patterns: ["*"]
