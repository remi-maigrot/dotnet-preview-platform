{{- /* Dashboards are JSON files exported from Grafana; the sidecar loads every ConfigMap with this label. */}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: preview-platform
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    grafana_folder: Platform
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
